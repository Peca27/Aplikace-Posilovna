<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Posilka</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Posilka">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <!-- Stopky mezi sériemi -->
  <div id="timerbar" class="timerbar" hidden>
    <div class="timerbar-progress" id="timer-progress"></div>
    <div class="timerbar-inner">
      <span class="timerbar-label">Pauza</span>
      <span class="timerbar-time" id="timer-time">1:30</span>
      <button class="timerbar-btn" data-action="rest-add">+15 s</button>
      <button class="timerbar-btn" data-action="rest-stop" aria-label="Zrušit pauzu">✕</button>
    </div>
  </div>

  <!-- Spodní navigace -->
  <nav class="tabbar">
    <button class="tab active" data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M7 12h10M5 8.5v7M8 6.5v11M16 6.5v11M19 8.5v7M2.5 12H5M19 12h2.5"/>
      </svg>
      <span>Trénink</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
      </svg>
      <span>Historie</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 20.5h17M5 16l4-5 3.5 3 5.5-7"/>
      </svg>
      <span>Statistiky</span>
    </button>
    <button class="tab" data-tab="exercises">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M8 6h12M8 12h12M8 18h12"/>
        <path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="2.6"/>
      </svg>
      <span>Cviky</span>
    </button>
  </nav>

  <!-- Bottom sheet -->
  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
