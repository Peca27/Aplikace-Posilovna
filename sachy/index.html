<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Šachy</title>
  <meta name="description" content="Šachy pro jednoho i dva hráče – offline, s výkladem pravidel a nápovědou">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Šachy">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <section class="player" id="player-top"></section>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="Šachovnice"></div>
      <svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
    </div>

    <section class="player" id="player-bottom"></section>

    <main class="info" id="info"></main>
  </div>

  <!-- Nápověda -->
  <div class="hint-panel" id="hint-panel" hidden></div>

  <!-- Spodní lišta -->
  <nav class="toolbar">
    <button class="tool" data-action="open-new-game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>
      </svg>
      <span>Nová hra</span>
    </button>
    <button class="tool" data-action="undo" id="btn-undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
      </svg>
      <span>Zpět</span>
    </button>
    <button class="tool tool-hint" data-action="hint" id="btn-hint">
      <span class="hint-bubble">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>
        </svg>
      </span>
      <span>Nápověda</span>
    </button>
    <button class="tool" data-action="open-rules">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/>
      </svg>
      <span>Pravidla</span>
    </button>
    <button class="tool" data-action="open-options">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
      </svg>
      <span>Možnosti</span>
    </button>
  </nav>

  <!-- Pravidla -->
  <div class="page" id="rules" hidden role="dialog" aria-modal="true" aria-labelledby="rules-title">
    <header class="page-head">
      <h2 id="rules-title">Pravidla šachu</h2>
      <button class="page-done" data-action="close-rules">Hotovo</button>
    </header>
    <nav class="toc" id="rules-toc"></nav>
    <div class="page-body" id="rules-body"></div>
  </div>

  <!-- Bottom sheet -->
  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div>
  </div>

  <script src="engine.js"></script>
  <script src="pieces.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
